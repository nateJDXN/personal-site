{% assign sotd = site.data.song_of_the_day %}
{% if sotd.tracks and sotd.tracks.size > 0 %}
<!-- Song of the day: custom controls driving a hidden Spotify embed -->
<div class="sotd" id="sotd" hidden>
    <a class="sotd-track" id="sotd-track" target="_blank" rel="noopener"></a>
    <div class="sotd-controls">
        <button class="sotd-btn" id="sotd-prev" type="button" aria-label="previous track">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg>
        </button>
        <button class="sotd-btn" id="sotd-toggle" type="button" aria-label="play">
            <svg class="sotd-icon-play" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2v12l10-6z"/></svg>
            <svg class="sotd-icon-pause" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg>
        </button>
        <button class="sotd-btn" id="sotd-next" type="button" aria-label="next track">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg>
        </button>
        <input class="sotd-seek" id="sotd-seek" type="range" min="0" max="0" value="0" step="100" aria-label="seek">
        <span class="sotd-time" id="sotd-time">0:00</span>
    </div>
    <div class="sotd-embed"><div id="sotd-embed"></div></div>
</div>
<script>
    window.SOTD = {
        playlist: {{ sotd.playlist | jsonify }},
        tracks: {{ sotd.tracks | jsonify }}
    };
</script>
<script defer src="{{ '/assets/js/song-of-the-day.js' | relative_url }}"></script>
{% endif %}
